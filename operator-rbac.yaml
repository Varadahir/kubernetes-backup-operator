apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-operator
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator
rules:

  # BackupPolicy CRD
  - apiGroups:
      - backup.example.com
    resources:
      - backuppolicies
      - backuppolicies/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # CronJobs
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # CustomResourceDefinitions
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: default